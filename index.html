<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta Meteorológica</title>
    <link rel="stylesheet" href="sistema/css/style.css">
    <script src="sistema/js/script.js" defer></script>
</head>
<body>
    <ul id="favoritos"></ul>

    <header>
        <h1>Consulta Meteorológica</h1>
        <form id="busca" class="barra-pesquisa">
            <button type="submit" id="botao" aria-label="Pesquisar">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </button>
            <input type="text" id="pesquisa" placeholder="Busque por uma cidade..." autocomplete="off">
        </form>
    </header>

    <aside id="feedback"></aside>

    <main>
        <ul id="lista"></ul>
        <div id="clima">
            <div id="hoje"></div>
            <div id="proximos-dias"></div>
        </div>
    </main>

    <footer>
        <p>Dados fornecidos por <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo.</a></p>
    </footer>
</body>
</html>
